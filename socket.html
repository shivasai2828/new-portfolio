<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.io Mastery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #111118;
        --surface2: #1a1a25;
        --border: #2a2a3a;
        --accent: #00e5ff;
        --accent2: #7c3aed;
        --accent3: #10b981;
        --warn: #f59e0b;
        --text: #e2e8f0;
        --text2: #94a3b8;
        --code-bg: #0d0d16;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* SIDEBAR */
      #sidebar {
        width: 280px;
        min-width: 280px;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #sidebar-header {
        padding: 20px 18px 16px;
        border-bottom: 1px solid var(--border);
      }
      #sidebar-header h1 {
        font-family: "Unbounded", sans-serif;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.08em;
        color: var(--accent);
        text-transform: uppercase;
      }
      #sidebar-header p {
        font-size: 11px;
        color: var(--text2);
        margin-top: 4px;
      }
      #topic-list {
        overflow-y: auto;
        flex: 1;
        padding: 8px 0;
      }
      .topic-item {
        padding: 10px 18px;
        cursor: pointer;
        font-size: 12.5px;
        color: var(--text2);
        border-left: 3px solid transparent;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .topic-item:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .topic-item.active {
        border-left-color: var(--accent);
        background: var(--surface2);
        color: var(--accent);
        font-weight: 600;
      }
      .topic-num {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: var(--border);
        min-width: 20px;
      }
      .topic-item.active .topic-num {
        color: var(--accent2);
      }

      /* MAIN */
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #topbar {
        padding: 14px 28px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #topbar h2 {
        font-family: "Unbounded", sans-serif;
        font-size: 15px;
        font-weight: 700;
      }
      .badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        padding: 3px 10px;
        border-radius: 20px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text2);
      }

      #content-area {
        flex: 1;
        overflow-y: auto;
        display: flex;
        gap: 0;
      }

      /* LESSON PANEL */
      #lesson-panel {
        flex: 1;
        padding: 28px;
        overflow-y: auto;
        max-width: 680px;
      }
      #lesson-panel h3 {
        font-family: "Unbounded", sans-serif;
        font-size: 17px;
        margin-bottom: 16px;
        color: var(--accent);
      }
      #lesson-panel h4 {
        font-size: 13px;
        font-weight: 700;
        color: var(--warn);
        margin: 20px 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      #lesson-panel p {
        font-size: 13.5px;
        line-height: 1.8;
        color: var(--text2);
        margin-bottom: 12px;
      }
      #lesson-panel ul {
        padding-left: 18px;
        margin-bottom: 12px;
      }
      #lesson-panel li {
        font-size: 13px;
        line-height: 1.8;
        color: var(--text2);
        margin-bottom: 4px;
      }
      #lesson-panel strong {
        color: var(--text);
      }

      .concept-box {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent2);
        border-radius: 6px;
        padding: 14px 16px;
        margin: 14px 0;
        font-size: 13px;
        line-height: 1.7;
        color: var(--text);
      }
      .warn-box {
        background: #1a1200;
        border: 1px solid #3a2a00;
        border-left: 3px solid var(--warn);
        border-radius: 6px;
        padding: 14px 16px;
        margin: 14px 0;
        font-size: 13px;
        line-height: 1.7;
        color: #fcd34d;
      }
      .success-box {
        background: #001a10;
        border: 1px solid #003020;
        border-left: 3px solid var(--accent3);
        border-radius: 6px;
        padding: 14px 16px;
        margin: 14px 0;
        font-size: 13px;
        line-height: 1.7;
        color: #6ee7b7;
      }

      /* CODE BLOCK */
      .code-block {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin: 14px 0;
        overflow: hidden;
      }
      .code-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        background: #0f0f1a;
      }
      .code-header span {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--text2);
      }
      .copy-btn {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        padding: 3px 10px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text2);
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .copy-btn:hover {
        background: var(--accent);
        color: #000;
        border-color: var(--accent);
      }
      .code-block pre {
        padding: 16px;
        overflow-x: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 12.5px;
        line-height: 1.75;
        color: #cdd9f5;
      }

      /* Syntax coloring via spans */
      .kw {
        color: #c792ea;
      }
      .str {
        color: #c3e88d;
      }
      .fn {
        color: #82aaff;
      }
      .cm {
        color: #546e7a;
        font-style: italic;
      }
      .num {
        color: #f78c6c;
      }
      .ev {
        color: #00e5ff;
      }
      .obj {
        color: #ffcb6b;
      }

      /* RIGHT PANEL - PLAYGROUND */
      #playground {
        width: 420px;
        min-width: 420px;
        border-left: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        flex-direction: column;
      }
      #playground-header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #playground-header h3 {
        font-family: "Unbounded", sans-serif;
        font-size: 12px;
        color: var(--accent3);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .dot.green {
        background: var(--accent3);
        box-shadow: 0 0 8px var(--accent3);
      }
      .dot.red {
        background: #ef4444;
      }
      .dot.yellow {
        background: var(--warn);
      }

      #sim-area {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .sim-card {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .sim-card-header {
        padding: 8px 12px;
        background: #0f0f1a;
        border-bottom: 1px solid var(--border);
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sim-card-header .label {
        color: var(--text2);
      }
      .sim-card-body {
        padding: 12px;
      }

      #event-log {
        background: var(--code-bg);
        border-radius: 6px;
        padding: 10px;
        min-height: 100px;
        max-height: 140px;
        overflow-y: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        line-height: 1.7;
      }
      .log-entry {
        margin-bottom: 3px;
      }
      .log-entry.emit {
        color: #82aaff;
      }
      .log-entry.receive {
        color: #c3e88d;
      }
      .log-entry.connect {
        color: var(--accent3);
      }
      .log-entry.disconnect {
        color: #ef4444;
      }
      .log-entry.info {
        color: var(--text2);
      }

      .sim-input {
        width: 100%;
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 8px 10px;
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        outline: none;
      }
      .sim-input:focus {
        border-color: var(--accent);
      }
      .sim-btns {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .sim-btn {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        padding: 6px 12px;
        border-radius: 5px;
        border: 1px solid;
        cursor: pointer;
        transition: all 0.15s;
        font-weight: 600;
      }
      .sim-btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
      }
      .sim-btn.primary:hover {
        background: #00b8cc;
      }
      .sim-btn.secondary {
        background: transparent;
        border-color: var(--accent2);
        color: var(--accent2);
      }
      .sim-btn.secondary:hover {
        background: var(--accent2);
        color: #fff;
      }
      .sim-btn.danger {
        background: transparent;
        border-color: #ef4444;
        color: #ef4444;
      }
      .sim-btn.danger:hover {
        background: #ef4444;
        color: #fff;
      }
      .sim-btn.success {
        background: transparent;
        border-color: var(--accent3);
        color: var(--accent3);
      }
      .sim-btn.success:hover {
        background: var(--accent3);
        color: #000;
      }

      .status-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        transition: all 0.3s;
      }

      .room-display {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 6px;
      }
      .room-tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        padding: 3px 8px;
        border-radius: 3px;
        border: 1px solid var(--accent2);
        color: var(--accent2);
        background: #1a0a2e;
      }

      .client-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .client-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--code-bg);
        border-radius: 4px;
        padding: 5px 8px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
      }
      .client-id {
        color: var(--accent);
      }
      .client-rooms {
        color: var(--text2);
        font-size: 10px;
      }

      /* NAV BUTTONS */
      #nav-row {
        padding: 12px 18px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
      }
      .nav-btn {
        flex: 1;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        padding: 8px;
        border-radius: 5px;
        border: 1px solid var(--border);
        background: var(--surface2);
        color: var(--text2);
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
      }
      .nav-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* PROGRESS */
      #progress-bar-wrap {
        padding: 10px 18px;
        border-top: 1px solid var(--border);
      }
      .progress-track {
        background: var(--surface2);
        border-radius: 10px;
        height: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent2), var(--accent));
        transition: width 0.4s;
        border-radius: 10px;
      }
      #progress-text {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: var(--text2);
        margin-top: 5px;
      }

      /* scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <!-- SIDEBAR -->
    <div id="sidebar">
      <div id="sidebar-header">
        <h1>⚡ Socket.io</h1>
        <p>Interactive Mastery Course</p>
      </div>
      <div id="topic-list" id="topic-list"></div>
      <div id="progress-bar-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>
        <div id="progress-text">0 / 10 topics</div>
      </div>
    </div>

    <!-- MAIN -->
    <div id="main">
      <div id="topbar">
        <h2 id="topic-title">Welcome to Socket.io</h2>
        <span class="badge" id="topic-badge">Topic 1/10</span>
      </div>
      <div id="content-area">
        <div id="lesson-panel"></div>
        <div id="playground">
          <div id="playground-header">
            <div class="dot yellow"></div>
            <div class="dot red"></div>
            <div class="dot green" id="conn-dot"></div>
            <h3>Live Playground</h3>
          </div>
          <div id="sim-area"></div>
          <div id="nav-row">
            <button class="nav-btn" onclick="prevTopic()">← Prev</button>
            <button class="nav-btn" onclick="nextTopic()">Next →</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ─── DATA ───────────────────────────────────────────────────────────
      const topics = [
        {
          title: "What is Socket.io?",
          lesson: `
    <h3>What is Socket.io?</h3>
    <p>Socket.io is a JavaScript library that enables <strong>real-time, bidirectional, event-driven communication</strong> between the browser (client) and a Node.js server.</p>
    <div class="concept-box">
      💡 Think of it like a phone call — both sides can talk and listen at any time. Unlike HTTP, which is like sending letters (request → wait → response).
    </div>
    <h4>Why Socket.io over plain WebSockets?</h4>
    <ul>
      <li>Auto-reconnection when connection drops</li>
      <li>Fallback to HTTP long-polling if WebSockets aren't available</li>
      <li>Room & namespace support built-in</li>
      <li>Broadcasting to multiple clients easily</li>
      <li>Works across all browsers reliably</li>
    </ul>
    <h4>How it works</h4>
    <p>Socket.io uses <strong>WebSockets</strong> as its primary transport. A persistent connection is opened and both sides can push data to each other instantly.</p>
    <div class="code-block">
      <div class="code-header"><span>server.js (Node.js)</span><button class="copy-btn" onclick="copyCode(this)">copy</button></div>
      <pre><span class="cm">// 1. Install: npm install socket.io express</span>
<span class="kw">const</span> <span class="obj">express</span> = <span class="fn">require</span>(<span class="str">'express'</span>)
<span class="kw">const</span> { <span class="obj">createServer</span> } = <span class="fn">require</span>(<span class="str">'http'</span>)
<span class="kw">const</span> { <span class="obj">Server</span> } = <span class="fn">require</span>(<span class="str">'socket.io'</span>)

<span class="kw">const</span> <span class="obj">app</span> = <span class="fn">express</span>()
<span class="kw">const</span> <span class="obj">httpServer</span> = <span class="fn">createServer</span>(<span class="obj">app</span>)
<span class="kw">const</span> <span class="obj">io</span> = <span class="kw">new</span> <span class="fn">Server</span>(<span class="obj">httpServer</span>)

<span class="obj">io</span>.<span class="fn">on</span>(<span class="str">'connection'</span>, (<span class="obj">socket</span>) => {
  <span class="obj">console</span>.<span class="fn">log</span>(<span class="str">'Client connected:'</span>, <span class="obj">socket</span>.id)
})

<span class="obj">httpServer</span>.<span class="fn">listen</span>(<span class="num">3000</span>)</pre>
    </div>
    <div class="code-block">
      <div class="code-header"><span>client.html (Browser)</span><button class="copy-btn" onclick="copyCode(this)">copy</button></div>
      <pre><span class="cm">&lt;!-- 2. Include Socket.io client --&gt;</span>
&lt;script src=<span class="str">"/socket.io/socket.io.js"</span>&gt;&lt;/script&gt;
&lt;script&gt;
  <span class="kw">const</span> <span class="obj">socket</span> = <span class="fn">io</span>() <span class="cm">// connects to same server</span>
  
  <span class="obj">socket</span>.<span class="fn">on</span>(<span class="str">'connect'</span>, () => {
    <span class="obj">console</span>.<span class="fn">log</span>(<span class="str">'Connected! ID:'</span>, <span class="obj">socket</span>.id)
  })
&lt;/script&gt;</pre>
    </div>
    <div class="success-box">✅ That's all it takes to establish a real-time connection! The playground on the right simulates this.</div>
  `,
          playground: "connection",
        },
        {
          title: "Emitting Events",
          lesson: `
    <h3>Emitting Events</h3>
    <p>The core of Socket.io is <strong>events</strong>. You can emit (send) any named event with any data — strings, objects, arrays.</p>
    <h4>Client → Server</h4>
    <div class="code-block">
      <div class="code-header"><span>client.js</span><button class="copy-btn" onclick="copyCode(this)">copy</button></div>
      <pre><span class="cm">// Send a message event with a string</span>
<span class="obj">socket</span>.<span class="fn">emit</span>(<span class="str">'message'</span>, <span class="str">'Hello server!'</span>)

<span class="cm">// Send with an object</span>
<span class="obj">socket</span>.<span class="fn">emit</span>(<span class="str">'chat'</span>, {
  user: <span class="str">'Alice'</span>,
  text: <span class="str">'Hi everyone!'</span>,
  timestamp: <span class="obj">Date</span>.<span class="fn">now</span>()
})

<span class="cm">// Send multiple arguments</span>
<span class="obj">socket</span>.<span class="fn">emit</span>(<span class="str">'move'</span>, <span class="num">100</span>, <span class="num">200</span>) <span class="cm">// x, y coords</span></pre>
    </div>
    <h4>Server → Client</h4>
    <div class="code-block">
      <div class="code-header"><span>server.js</span><button class="copy-btn" onclick="copyCode(this)">copy</button></div>
      <pre><span class="obj">io</span>.<span class="fn">on</span>(<span class="str">'connection'</span>, (<span class="obj">socket</span>) => {
  
  <span class="cm">// Listen for 'message' event from client</span>
  <span class="obj">socket</span>.<span class="fn">on</span>(<span class="str">'message'</span>, (<span class="obj">data</span>) => {
    <span class="obj">console</span>.<span class="fn">log</span>(<span class="str">'Received:'</span>, <span class="obj">data</span>)
  })

  <span class="cm">// Send event BACK to that specific client</span>
  <span class="obj">socket</span>.<span class="fn">emit</span>(<span class="str">'welcome'</span>, {
    msg: <span class="str">'Connected successfully!'</span>,
    id: <span class="obj">socket</span>.id
  })
})</pre>
    </div>
    <div class="concept-box">
      💡 <strong>Event names</strong> can be anything you want — 'message', 'user:join', 'game:move', 'order:update'. Use a naming convention like <code>namespace:action</code> for clarity.
    </div>
    <h4>Acknowledgements (Callbacks)</h4>
    <div class="code-block">
      <div class="code-header"><span>client.js — with callback</span><button class="copy-btn" onclick="copyCode(this)">copy</button></div>
      <pre><span class="cm">// Client sends and waits for server confirmation</span>
<span class="obj">socket</span>.<span class="fn">emit</span>(<span class="str">'save-data'</span>, { name: <span class="str">'Alice'</span> }, (<span class="obj">response</span>) => {
  <span class="cm">// This runs when server calls the callback</span>
  <span class="obj">console</span>.<span class="fn">log</span>(<span class="str">'Server said:'</span>, <span class="obj">response</span>.status) <span class="cm">// 'ok'</span>
})

<span class="cm">// Server side:</span>
<span class="obj">socket</span>.<span class="fn">on</span>(<span class="str">'save-data'</span>, (<span class="obj">data</span>, <span class="obj">callback</span>) => {
  <span class="cm">// ... save to DB ...</span>
  <span class="fn">callback</span>({ status: <span class="str">'ok'</span>, id: <span class="num">42</span> })
})</pre>
    </div>
  `,
          playground: "emit",
        },
        {
          title: "Listening to Events",
          lesson: `
    <h3>Listening to Events</h3>
    <p>Use <code>.on()</code> to listen, <code>.once()</code> to listen only once, and <code>.off()</code> to stop listening.</p>
    <div class="code-block">
      <div class="code-header"><span>client.js</span><button class="copy-btn" onclick="copyCode(this)">copy</button></div>
      <pre><span class="cm">// Listen continuously</span>
<span class="obj">socket</span>.<span class="fn">on</span>(<span class="str">'message'</span>, (<span class="obj">data</span>) => {
  <span class="obj">console</span>.<span class="fn">log</span>(<span class="str">'New message:'</span>, <span class="obj">data</span>)
})

<span class="cm">// Listen only ONCE (auto-removes after first trigger)</span>

      function simBroadcast(type, target) {
        if (type === "io.emit") {
          log(`io.emit("news", data) → sent to ALL clients`, "emit");
          log("✅ A1b2 received it", "receive");
          log("✅ C3d4 received it", "receive");
          log("✅ E5f6 received it", "receive");
        } else if (type === "broadcast") {
          log(
            `socket.broadcast.emit("user-joined") → all EXCEPT sender`,
            "emit",
          );
          log("✅ C3d4 received it", "receive");
          log("✅ E5f6 received it", "receive");
          log("⛔ A1b2 (sender) did NOT receive it", "disconnect");
        } else {
          log(`io.to("C3d4").emit("private") → only C3d4`, "emit");
          log("✅ C3d4 received it", "receive");
          log("⛔ A1b2 did not receive it", "info");
          log("⛔ E5f6 did not receive it", "info");
        }
      }

      let myRooms = new Set();
      function simJoinRoom(room) {
        myRooms.add(room);
        document.getElementById("my-rooms").textContent =
          [...myRooms].join(", ") || "—";
        log(`socket.join("${room}") → added to room`, "connect");
        log(`socket.rooms = {mySocket, ${[...myRooms].join(", ")}}`, "info");
      }
      function simLeaveRoom(room) {
        myRooms.delete(room);
        document.getElementById("my-rooms").textContent =
          [...myRooms].join(", ") || "—";
        log(`socket.leave("${room}") → removed from room`, "disconnect");
      }
      function simEmitToRoom(room) {
        if (myRooms.has(room)) {
          log(`io.to("${room}").emit("msg") → sent to all in room`, "emit");
          log(
            `→ All ${Math.floor(Math.random() * 4) + 2} sockets in "${room}" received it`,
            "receive",
          );
        } else {
          log(`⚠️ Not in room "${room}" — join first!`, "disconnect");
        }
      }

      let activeNS = new Set();
      function simNamespace(ns) {
        if (ns === "/admin") {
          log(`io("${ns}", {auth:{token:"..."}}) → connecting`, "emit");
          setTimeout(() => {
            log(`❌ Middleware rejected: "Unauthorized"`, "disconnect");
            log(`connect_error fired → "Unauthorized"`, "disconnect");
          }, 400);
          return;
        }
        activeNS.add(ns);
        document.getElementById("ns-active").textContent = [...activeNS].join(
          ", ",
        );
        log(`io("${ns}") → connected to namespace`, "connect");
        log(`socket.on("connect") fired on "${ns}" namespace`, "receive");
        if (ns === "/chat")
          log(`← Server: "welcome" event → "Welcome to chat!"`, "receive");
        if (ns === "/game")
          log(
            `← Server: "game-state" event → {players:3,status:"waiting"}`,
            "receive",
          );
      }

      function simAuthConnect(noToken) {
        const token = noToken
          ? null
          : document.getElementById("auth-token").value;
        log(
          `io({auth:{token:${token ? `"${token}"` : "undefined"}}}) → connecting`,
          "emit",
        );
        setTimeout(() => {
          if (!token) {
            log('❌ Middleware: "No token provided"', "disconnect");
            log("connect_error fired", "disconnect");
          } else if (token.includes("invalid")) {
            log('❌ Middleware: "Invalid token"', "disconnect");
          } else {
            log("✅ Middleware passed → socket.data.user set", "connect");
            log("connection event fired → user authenticated", "receive");
          }
        }, 400);
      }

      let clientReady = true;
      function simToggleReady(ready) {
        clientReady = ready;
        log(
          `Client state: ${ready ? "✅ READY (buffer empty)" : "⛔ BUSY (connection congested)"}`,
          "info",
        );
      }
      function simVolatile() {
        log(
          `io.volatile.emit("cursor-pos", {x:${Math.floor(Math.random() * 800)},y:${Math.floor(Math.random() * 600)}})`,
          "emit",
        );
        setTimeout(() => {
          if (clientReady) log("✅ Delivered to client", "receive");
          else
            log(
              "⛔ DROPPED — client not ready (volatile, no retry)",
              "disconnect",
            );
        }, 200);
      }
      function simNormal() {
        log(`io.emit("update", {data:"important"}) — normal event`, "emit");
        setTimeout(
          () =>
            log(
              "✅ Queued & delivered (even if client was busy — retried)",
              "receive",
            ),
          200,
        );
      }

      function simScaleEmit(withRedis) {
        log(
          withRedis ? "🔴 Redis connected on port 6379" : "❌ No Redis adapter",
          "info",
        );
        log(
          `Server 1: io.emit("news", {title:"Breaking!"})  → emitting`,
          "emit",
        );
        setTimeout(() => {
          log("✅ Client A (Server 1) received it", "receive");
          if (withRedis) {
            log("→ Message published to Redis channel", "info");
            setTimeout(() => {
              log("← Server 2 received from Redis", "info");
              log("✅ Client B (Server 2) received it", "receive");
            }, 300);
          } else {
            log(
              "⛔ Client B (Server 2) NEVER received it — no Redis!",
              "disconnect",
            );
          }
        }, 300);
      }

      function addChatMsg(user, text, type = "other") {
        const msgs = document.getElementById("chat-msgs");
        if (!msgs) return;
        const colors = {
          Alice: "#00e5ff",
          Bob: "#c792ea",
          Charlie: "#10b981",
          system: "#f59e0b",
        };
        const color = colors[user] || "#94a3b8";
        const div = document.createElement("div");
        div.style.cssText = "margin-bottom:4px";
        const time = new Date().toLocaleTimeString("en", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
        div.innerHTML = `<span style="color:${color}">${user}</span> <span style="color:#546e7a">${time}</span> <span style="color:#cdd9f5">${text}</span>`;
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
      }
      function simChatSend() {
        const inp = document.getElementById("chat-input");
        const text = inp.value.trim();
        if (!text) return;
        addChatMsg("You (Alice)", text, "me");
        log(`socket.emit("message", "${text}")`, "emit");
        log('→ Server received, io.emit("message") → all clients', "info");
        log("← Acknowledgement: {delivered:true}", "receive");
        inp.value = "";
      }
      function simBotMsg(user) {
        const msgs = [
          "Hey there! 😊",
          "What's up?",
          "Anyone here?",
          "This Socket.io demo is cool!",
          "Learning real-time stuff!",
        ];
        const text = msgs[Math.floor(Math.random() * msgs.length)];
        addChatMsg(user, text);
        log(
          `← Server: socket.emit("message", {user:"${user}",text:"${text}"})`,
          "receive",
        );
      }
      function simUserLeave() {
        log('← Server: io.emit("user-left", {name:"Bob"})', "disconnect");
        log('← Server: io.emit("user-list", ["Alice","Charlie"])', "receive");
        addChatMsg("System", "Bob left the chat 👋", "system");
      }

      // ─── INIT ────────────────────────────────────────────────────────────
      renderAll();
    </script>
  </body>
</html>
